; ================================================================
; Pantheon Morte Map v4.1.1.0 —  User Configuration
; Edit values below, then restart the app for changes to take effect.
; Lines starting with ; are comments and are ignored.
; ================================================================

[window]
; Window X position (pixels from left edge of screen)
win_x = 1333 

; Window Y position (pixels from top edge of screen)
win_y = 298 

; Width of the map window when it first opens (pixels)
win_w = 580 

; Height of the map window when it first opens (pixels)
win_h = 400 

; Starting window opacity  0.0=invisible  1.0=fully opaque
default_opacity = 0.85

; Height of the top toolbar in pixels
top_bar_height = 76

; Width of the side panels (CAL / PINS / LAYERS) in pixels
panel_width = 340

; How long flash messages stay on screen (milliseconds)
flash_duration = 4000

; Enable saving/restoring window position and size
persist_window_geometry = true

; Keep zoom/pan when changing maps (still reload cal/pins)
keep_view_on_map_change = true


[zoom]
; Minimum zoom level  (0.01 lets you zoom way out for huge maps)
min_zoom = 0.01

; Maximum zoom level
max_zoom = 18.0

; How fast each scroll tick zooms (fraction of current zoom)
zoom_step = 0.12


[pins_and_calibration]
; Radius of the player position dot in pixels
dot_size = 14

; Diameter of calibration marker dots in pixels
calib_dot_size = 12

; Width of drop-pin teardrop in pixels
pin_w = 22

; Height of drop-pin teardrop in pixels
pin_h = 30

; Double-click within this many pixels to update existing cal point
update_threshold = 50


[layers]
; Opacity of layers below the topmost visible layer  (0.75 recommended)
lower_layer_opacity = 0.75


[cache]
; Resolution to cache large map images at.
; Options: 720p  1080p  1440p  2k  4k  8k  16k
; Cached copies sit next to originals (e.g. main_map_4k.png).
; First load is slow while the cache is built; every load after is fast.
; Delete the cached files to rebuild at a new resolution.
map_cache_resolution = 4k


[colors]
; Player dot fill #RRGGBB
player_fill = #ff3232

player_ring = #b40000

player_outer_ring = #ff5050

ping_cross = #ffb400

ping_circle = #ffb400

cal_stroke = #000000

cal_fill = #fff0f0

cal_label = #ffffb4

cal_edit_stroke = #ffdc00

cal_edit_fill = #fff064

pin_stroke = #640000

pin_fill = #d21e1e

pin_highlight_stroke = #ffdc00

pin_highlight_fill = #ffc800

pin_label = #ffdc50

pin_label_shadow = #000000

; Named world markers (typed coords) fill color
marker_fill = #2ee8c8

marker_ring = #00a88c

marker_label = #b0fff0


[player_animation]
; Extra animated pulse ring count (0 disables)
pulse_rings = 2

pulse_speed = 2.5

pulse_extent = 1.35

pulse_interval_ms = 40


[keybinds]
; Qt key sequence to hide/show window
toggle_map_visibility = Shift+M


[jumploc]
; /jumploc parts[] index for map X (left ↔ right)
map_x_index = 1

; /jumploc parts[] index for map Y (up ↔ down on map)
map_y_index = 3

; Token for game Z only (layer pick); 0=off; not used for dot position or status line
game_z_index = 2


[calibration_extra]
; Zoom level when entering CAL mode (0 = leave zoom unchanged)
cal_mode_snap_zoom = 1.0

lock_zoom_in_cal_mode = false


[update]
; Raw URL for update_manifest.json (GitHub raw)
manifest_url = https://raw.githubusercontent.com/XxNeroMortexX/Pantheon-Morte-Map/refs/heads/main/update_manifest.json


[location_behavior]
auto_center_on_loc = true

auto_zoom_on_loc = false


; Per-map Z-value to layer selection.
; Format: <map_safe_key>_Z_<LayerName> = <min_z>,<max_z>
[map_z_layers]
Main_Map_Z_World = 0,0

Halnir_Cave_Z_Upper = 39,41

Halnir_Cave_Z_Mid = 0,0

Halnir_Cave_Z_Lower = 0,0

Goblin_Cave_Z_Upper = 0,0

Goblin_Cave_Z_Mid = 0,0

Goblin_Cave_Z_Lower = 0,0

Black_Rose_Keep_Z_Upper_Dungeon = 0,0

Black_Rose_Keep_Z_Mid_Dungeon = 0,0

Black_Rose_Keep_Z_Lower_Dungeon_1 = 0,0

Black_Rose_Keep_Z_Lower_Dungeon_2 = 0,0

Black_Rose_Keep_Z_Reference = 0,0

Wildmound_Cradle_Z_Reference = 0,0

Wildmound_Cradle_Z_Lower_Dungeon = 0,0

Wildmound_Cradle_Z_Mid_Dungeon = 0,0

Wildmound_Cradle_Z_Upper_Dungeon = 0,0

Nightfall_Crypt_Z_Lower_2 = 0,0

Nightfall_Crypt_Z_Lower_1 = 0,0

Nightfall_Crypt_Z_Mid = 0,0

Nightfall_Crypt_Z_Upper = 0,0

